appId: com.simple-code-gui.app
productName: DonutCode
directories:
  buildResources: resources
  output: dist-build
files:
  - dist/**/*
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tada-samples
    to: tada-samples
  - from: scripts/donutcode-server
    to: bin/donutcode-server

publish:
  provider: github
  owner: DonutsDelivery
  repo: simple-claude-gui
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: resources/icon.png
  executableName: donutcode
  desktop:
    StartupWMClass: donutcode
  synopsis: Distributed AI development workspace
  description: DonutCode manages AI coding sessions across projects and execution servers

appImage:
  artifactName: DonutCode-${version}.${ext}

deb:
  artifactName: DonutCode-${version}.${ext}
  depends:
    - libnotify4
    - libxtst6
    - libnss3

rpm:
  artifactName: DonutCode-${version}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: resources/icon.png
  artifactName: DonutCode-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true

win:
  target:
    - nsis
    - portable
    - appx
  icon: resources/icon.ico
  artifactName: DonutCode-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: DonutCode-Setup-${version}.${ext}

portable:
  artifactName: DonutCode-Portable-${version}.${ext}

appx:
  applicationId: SimpleCodeGUI
  displayName: DonutCode
  identityName: SimpleCodeGUI
  publisher: CN=DonutsDelivery
  publisherDisplayName: DonutsDelivery
  languages:
    - en-US
  artifactName: DonutCode-Store-${version}.${ext}
